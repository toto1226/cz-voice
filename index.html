<html lang="en">
<head>

<title>Critical Zone Check</title>
<style>:root{color-scheme:light}html,body{height:100%;margin:0}body{font-size:14px}[hidden]{display:none!important}</style>

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one phone-width column. Header, tabs, a question card that is the focus, a log, and a sticky voice dock. */
:root{
  --bg:#E9EEF1; --surface:#FFFFFF; --surface2:#F2F5F7; --ink:#12222B; --muted:#586A73; --line:#CAD5DB;
  --accent:#0A6C8C; --accent-ink:#FFFFFF;
  --ok:#1B7A4E; --ok-bg:#DDF1E6; --warn:#9A5800; --warn-bg:#FAE9CB; --bad:#B8232A; --bad-bg:#F9DADB;
  --font-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --font-num:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E171C; --surface:#16232A; --surface2:#1D2E37; --ink:#E6EEF1; --muted:#97A9B2; --line:#2B3E48;
    --accent:#52B7D6; --accent-ink:#06222C;
    --ok:#57C58C; --ok-bg:#143726; --warn:#EAA640; --warn-bg:#3B2B10; --bad:#F26A6F; --bad-bg:#40191C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E171C; --surface:#16232A; --surface2:#1D2E37; --ink:#E6EEF1; --muted:#97A9B2; --line:#2B3E48;
  --accent:#52B7D6; --accent-ink:#06222C;
  --ok:#57C58C; --ok-bg:#143726; --warn:#EAA640; --warn-bg:#3B2B10; --bad:#F26A6F; --bad-bg:#40191C;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;min-height:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px 8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{font-family:var(--font-num);font-weight:700;font-size:1.15rem;letter-spacing:.06em;background:var(--ink);color:var(--bg);border-radius:6px;padding:4px 8px;flex:none}
.brand h1{font-family:var(--font-num);font-size:1.35rem;font-weight:600;letter-spacing:.03em;margin:0;line-height:1.1;text-transform:uppercase}
.brand p{margin:0;font-size:.78rem;color:var(--muted)}
.when{font-size:.78rem;color:var(--muted);text-align:right;flex:none;font-variant-numeric:tabular-nums}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:4px;margin-block:4px 14px}
.tabs button{border:0;background:transparent;border-radius:7px;padding:8px 6px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
main{flex:1;display:flex;flex-direction:column;gap:14px;padding-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}
h2{margin:0;font-size:1.05rem}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;border-radius:6px;padding:9px 6px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:6px;flex:1 1 180px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 16px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.big{padding:15px 18px;font-size:1.05rem;width:100%}
.btn.small{padding:7px 11px;font-size:.85rem}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.hint-list{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:.85rem}
.prog{display:flex;flex-direction:column;gap:6px}
.prog-top{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.q{display:flex;flex-direction:column;gap:10px}
.q-ko{font-size:1.32rem;font-weight:700;line-height:1.38;text-wrap:balance;margin:0}
.q-en{margin:0;color:var(--muted);font-size:.86rem}
.q-hint{margin:0;font-size:.85rem;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:7px 10px}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-num);font-size:1rem;font-weight:600;letter-spacing:.03em;border:1px solid var(--line);border-radius:6px;padding:2px 9px;background:var(--surface2);align-self:flex-start}
.read{display:flex;align-items:baseline;gap:8px;font-family:var(--font-num);font-variant-numeric:tabular-nums;min-height:4rem}
.read b{font-size:3.6rem;font-weight:600;line-height:1}
.read span{font-size:1.4rem;color:var(--muted)}
.read.ok b{color:var(--ok)} .read.bad b{color:var(--bad)}
.read .flag{font-family:var(--font-body);font-size:.9rem;font-weight:700;background:var(--bad-bg);color:var(--bad);border-radius:6px;padding:2px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--font-num);font-size:1.15rem;font-weight:600;border-radius:6px;padding:1px 9px;background:var(--ok-bg);color:var(--ok);font-variant-numeric:tabular-nums}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chat{display:flex;flex-direction:column;gap:6px}
.msg{max-width:88%;padding:8px 12px;border-radius:12px;font-size:.92rem;line-height:1.45;overflow-wrap:anywhere}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.86rem}
.dock{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);margin-inline:-16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.dock-top{display:flex;align-items:center;gap:12px}
.mic{flex:none;width:64px;height:64px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;position:relative}
.mic svg{width:28px;height:28px}
.mic[data-state="listening"]{background:var(--bad);color:#fff}
.mic[data-state="listening"]::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--bad);animation:ring 1.3s ease-out infinite}
.mic[data-state="speaking"]{background:var(--ink);color:var(--bg)}
.mic:disabled{opacity:.45}
@keyframes ring{from{transform:scale(.9);opacity:.9}to{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){.mic[data-state="listening"]::after{animation:none}.bar i{transition:none}}
.status{flex:1;min-width:0}
.status b{display:block;font-size:.95rem}
.status span{display:block;font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:1.3em}
.quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.quick button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:.88rem;font-weight:500}
.say{display:flex;gap:6px}
.say input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.item .nm{font-weight:500;overflow-wrap:anywhere}
.item .en{grid-column:2;color:var(--muted);font-size:.78rem;overflow-wrap:anywhere}
.item .val{grid-column:2;font-family:var(--font-num);font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.item .act{grid-column:2;font-size:.85rem;color:var(--bad);overflow-wrap:anywhere}
.item .hist{grid-column:2;font-size:.78rem;color:var(--muted)}
.pill{font-size:.72rem;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap;align-self:start;margin-top:2px}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.skip{background:var(--surface2);color:var(--muted)}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sum div{background:var(--surface2);border-radius:9px;padding:9px 12px}
.sum b{display:block;font-family:var(--font-num);font-size:1.7rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.sum span{font-size:.78rem;color:var(--muted)}
.rules{display:flex;flex-direction:column;gap:10px}
.rule{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.rule:first-child{border-top:0}
.rule label{font-size:.75rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.rule input{width:76px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 8px;font-variant-numeric:tabular-nums}
.rule .nm{font-weight:500;min-width:0}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px;border-top:1px solid var(--line)}
.toggle input{width:22px;height:22px}
.modebar{display:flex;flex-direction:column;gap:6px;margin-block:2px 10px}
.modebar p{margin:0;font-size:.78rem;color:var(--muted)}
.f-sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.f-sec>summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;font-weight:700;cursor:pointer;list-style:none}
.f-sec>summary::-webkit-details-marker{display:none}
.f-sec>summary small{font-weight:400;color:var(--muted);margin-left:6px}
.f-sec>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:4px;flex:none;transition:transform .15s}
.f-sec[open]>summary::after{transform:rotate(-135deg)}
.f-count{font-family:var(--font-num);font-size:1.05rem;font-weight:600;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.f-items{display:flex;flex-direction:column;gap:1px;background:var(--line);border-top:1px solid var(--line)}
.f-item{background:var(--surface);padding:12px 16px;display:flex;flex-direction:column;gap:9px}
.f-item.bad{background:var(--bad-bg)}
.f-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.f-name{font-weight:500;min-width:0;overflow-wrap:anywhere}
.f-en{display:block;font-size:.76rem;color:var(--muted);font-weight:400}
.f-num{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.f-num input{width:104px;font-family:var(--font-num);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:4px 10px}
.f-unit{font-family:var(--font-num);font-size:1.1rem;color:var(--muted)}
.f-msg{margin:0;font-size:.85rem;font-weight:700;color:var(--bad)}
.f-item textarea,.f-act textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px;resize:vertical;font:inherit}
.f-act{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--bad);font-weight:700}
.f-item button[aria-pressed="true"].btn{background:var(--ink);color:var(--bg)}
button.chip{border:0;cursor:pointer}
.seg button[data-fy="n"][aria-pressed="true"]{background:var(--bad);color:#fff}
.seg button[data-fy="y"][aria-pressed="true"]{background:var(--ok);color:#fff}
.seg button[data-fy="na"][aria-pressed="true"]{background:var(--muted);color:var(--bg)}
.vrow{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.vrow label{font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.vrow label b{color:var(--ink);font-variant-numeric:tabular-nums}
.vrow select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 11px}
.vrow input[type=range]{width:100%;accent-color:var(--accent)}
details.card>summary{cursor:pointer;font-weight:700}
.jumps{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.bi{display:block;line-height:1.2}
.bi small{display:block;font-size:.78em;font-weight:400;opacity:.85;margin-top:1px;letter-spacing:0;text-transform:none}
.bi-i{font-size:.8em;font-weight:400;opacity:.85;letter-spacing:0;text-transform:none}
.pill .bi-i{font-size:.95em}
.rule label span{font-family:var(--font-num);font-size:.85rem}
.sync{margin-top:4px;font-size:.72rem;color:var(--ok);font-weight:500}
.sync.off{color:var(--muted)}
.sync.bad{color:var(--bad)}
.vrow input[type=text],.vrow input[type=url],.vrow input[type=password]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 11px}
.jumps button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:.85rem;font-weight:500}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <span class="brand-mark">CZ</span>
      <div><h1>The Critical Zone</h1><p id="brandSub"></p></div>
    </div>
    <div class="when"><div id="when"></div><div class="sync off" id="syncBadge"></div></div>
  </header>
  <div class="modebar">
    <div class="seg" role="group" aria-label="Input mode">
      <button type="button" data-mode="form" id="m-form" aria-pressed="true"></button>
      <button type="button" data-mode="voice" id="m-voice" aria-pressed="false"></button>

  </div>
  <nav class="tabs" role="tablist" aria-label="Screens">
    <button role="tab" id="t-run" data-tab="run" aria-selected="true"></button>
    <button role="tab" id="t-log" data-tab="log" aria-selected="false"></button>

  <main>
    <section id="tab-run" aria-labelledby="t-run"><div id="runBody"></div><div id="vsetWrap" hidden style="margin-top:14px"></div></section>

  </main>
  <div class="dock" id="dock">
    <div class="dock-top">
      <button class="mic" id="mic" type="button" data-state="idle" aria-label="Microphone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>

      <input id="say" type="text" inputmode="text" placeholder="Type instead of speaking" aria-label="Type an answer">
      <button class="btn primary" type="submit" id="sendBtn">Send</button>
    </form>
  </div>
</div>

var KD={'영':0,'공':0,'일':1,'이':2,'삼':3,'사':4,'오':5,'육':6,'륙':6,'칠':7,'팔':8,'구':9};
function koInt(s){
  var total=0,num=null,any=false;
  for(var i=0;i<s.length;i++){
    var ch=s[i];
    if(ch in KD){ num=(num===null?0:num*10)+KD[ch]; any=true; }
    else if(ch==='십'||ch==='백'){ var m=ch==='십'?10:100; total+=(num===null?1:num)*m; num=null; any=true; }
    else return null;
  }
  return any?total+(num||0):null;
}
var EN1={zero:0,oh:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19};
var EN10={twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};
function enInt(tokens){
  var total=0,cur=0,any=false;
  for(var i=0;i<tokens.length;i++){
    var w=tokens[i];
    if(w in EN1){cur+=EN1[w];any=true;}
    else if(w in EN10){cur+=EN10[w];any=true;}
    else if(w==='hundred'){cur=(cur||1)*100;any=true;}
    else if(w==='and'){}
    else return null;
  }
  return any?total+cur:null;
}
function parseNum(raw){
  if(raw==null) return null;
  var s=String(raw).toLowerCase().replace(/,/g,'').trim();
  var neg=/(마이너스|영하|minus|negative|음수)/.test(s)||/(^|\s)-\s*\d/.test(s);
  s=s.replace(/마이너스|영하|영상|minus|negative|plus|음수/g,' ');
  var v=null,m=s.match(/(\d+)\s*(?:\.|점|point)\s*(\d+)/);
  if(m){ v=parseFloat(m[1]+'.'+m[2]); }
  else { m=s.match(/\d+(?:\.\d+)?/); if(m) v=parseFloat(m[0]); }
  if(v===null){
    var k=s.replace(/도|°|℉|℃|화씨|섭씨|피피엠|ppm|퍼센트|degrees?|fahrenheit|\s/g,'');
    var parts=k.split('점');
    var a=parts[0]===''?0:koInt(parts[0]);
    if(a!==null&&/[가-힣]/.test(k)){
      v=a;
      if(parts.length>1&&parts[1]){ var dec=''; for(var i=0;i<parts[1].length;i++){ var c=parts[1][i]; if(c in KD) dec+=KD[c]; else { dec=null; break; } } if(dec) v=parseFloat(a+'.'+dec); }
    } else {
      var toks=s.replace(/[^a-z\s-]/g,' ').replace(/-/g,' ').split(/\s+/).filter(Boolean).filter(function(w){return !/^(degrees?|celsius|fahrenheit|centigrade|ppm)$/.test(w);});
      var pi=toks.indexOf('point');
      var head=pi>=0?toks.slice(0,pi):toks; var tail=pi>=0?toks.slice(pi+1):[];
      var e=enInt(head);
      if(e!==null){ v=e; if(tail.length){ var d2=''; tail.forEach(function(t){ if(t in EN1&&EN1[t]<10) d2+=EN1[t]; }); if(d2) v=parseFloat(e+'.'+d2); } }
    }
  }
  if(v===null||isNaN(v)) return null;
  return neg?-v:v;
}

  var lo=r.min!=null?cv(r.min):null, hi=r.max!=null?cv(r.max):null;

function T(k){ var f=TT[S.lang][k]; if(typeof f==='function') return f.apply(null,[].slice.call(arguments,1)); return f; }

/* ================= 음성 입출력 ================= */
var R=null;
function setState(s){
  S.state=s; var mic=$('#mic'); mic.dataset.state=s;
  var l={idle:['Tap the mic','마이크를 누르세요'],speaking:['Reading','읽는 중'],listening:['Listening','듣는 중']}[s]||['',''];
  if(!S.mic&&s==='idle') l=['Answer with the box or buttons','입력창이나 버튼으로 답하세요'];
  if(S.paused) l=['Paused','일시정지'];
  $('#stateLbl').innerHTML=B(l[0],l[1]);
}
function voiceList(){
  var vs=[]; try{ if('speechSynthesis' in window&&typeof speechSynthesis.getVoices==='function') vs=speechSynthesis.getVoices()||[]; }catch(e){}
  var pre=S.lang==='ko'?'ko':'en';
  return vs.filter(function(v){ return v.lang&&String(v.lang).toLowerCase().replace('_','-').indexOf(pre)===0; });
}
function pickVoice(){
  var list=voiceList(); if(!list.length) return null;
  var want=S.voice[S.lang];
  if(want){ for(var i=0;i<list.length;i++){ if(list[i].voiceURI===want) return list[i]; } }
  function score(v){
    var n=(v.name||'')+' '+(v.voiceURI||''), sc=0;
    if(/google/i.test(n)) sc+=3;
    if(/neural|natural|online|wavenet|premium|enhanced/i.test(n)) sc+=4;
    if(v.localService===false) sc+=1;
    if(S.lang==='en'&&/en[-_]us/i.test(v.lang)) sc+=1;
    return sc;
  }
  return list.slice().sort(function(a,b){return score(b)-score(a);})[0];
}
function speechClean(t){
  if(S.lang!=='en') return t;
  return t.replace(/\s*\(([^)]*)\)/g,', $1').replace(/\s-\s/g,', ').replace(/#(\d+)/g,'number $1').replace(/\s\/\s/g,' and ').replace(/\bw\//g,'with');
}
function fmtRate(){ return (Math.round(S.rate*100)/100)+'×'; }
function syncRate(){ var r=$('#rateRange'); if(r) r.value=S.rate; var v=$('#rateVal'); if(v) v.textContent=fmtRate(); }
function renderVset(){
  var w=$('#vsetWrap'); if(!w) return;
  var d0=w.querySelector('details'), wasOpen=!!(d0&&d0.open);
  var list=voiceList(), cur=pickVoice(), ko=S.lang==='ko';
  var opts=list.length?list.map(function(v){ return '<option value="'+esc(v.voiceURI)+'"'+(cur&&cur.voiceURI===v.voiceURI?' selected':'')+'>'+esc(v.name)+' ('+esc(v.lang)+')'+(v.localService===false?' · online':'')+'</option>'; }).join(''):'<option value="">'+esc(P('No voices found on this device','이 기기에서 음성을 찾지 못했어요'))+'</option>';
  var note=list.length
    ? B('You can pick from the voices installed on this phone. For more natural voices, install voice data under Text-to-speech in the phone settings; it may then appear in this list.','목소리는 이 휴대폰에 설치된 음성 중에서 고를 수 있어요. 더 자연스러운 음성은 휴대폰 설정의 텍스트 음성 변환에서 음성 데이터를 설치하면 목록에 나타날 수 있어요.')
    : B('No '+(ko?'Korean':'English')+' voice found. Install voice data under Text-to-speech in the phone settings.',(ko?'한국어':'영어')+' 음성을 찾지 못했어요. 휴대폰 설정의 텍스트 음성 변환에서 음성 데이터를 설치해 보세요.');
  w.innerHTML='<details class="card" id="vset"'+(wasOpen?' open':'')+'><summary>'+Bi('Voice settings','음성 설정')+'</summary>'
   +'<div class="vrow"><label for="voiceSel">'+B('Voice ('+(ko?'Korean':'English')+')','목소리 ('+(ko?'한국어':'English')+')')+'</label><select id="voiceSel">'+opts+'</select></div>'
   +'<div class="vrow"><label for="rateRange"><span>'+B('Reading speed','읽는 속도')+'</span> <b id="rateVal">'+esc(fmtRate())+'</b></label><input type="range" id="rateRange" min="0.6" max="1.6" step="0.05" value="'+S.rate+'"></div>'

function testVoice(){
  stopListen(); S.token++;
  var sample=S.lang==='ko'?'안녕하세요. 워크인 냉장고 온도는 '+fmt({unit:'°F'},38)+'입니다. 맞으면 예라고 답해 주세요.':'Hello. The walk-in cooler reads '+fmt({unit:'°F'},38)+'. Say yes if that is correct.';
  setState('speaking'); speak(sample).then(function(){ setState('idle'); });
}
function speak(text){
  return new Promise(function(res){
    if(!S.tts){ return res(); }
    var done=false, t;
    var fin=function(){ if(!done){done=true;clearTimeout(t);res();} };
    try{
      speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(speechClean(text));
      var v=pickVoice();
      u.lang=v?v.lang:(S.lang==='ko'?'ko-KR':'en-US'); u.rate=S.rate;
      if(v) u.voice=v;
      u.onend=fin; u.onerror=fin;
      t=setTimeout(fin,1500+text.length*170/Math.max(S.rate,0.5));
      speechSynthesis.speak(u);
    }catch(e){ fin(); }
  });
}
function stopListen(){
  if(R){ try{R.onend=null;R.onresult=null;R.onerror=null;R.abort();}catch(e){} R=null; }
}
function listen(force){
  if(!S.mic||!SR||S.paused) return;
  if(!S.running&&!force) return;
  stopListen();
  var r=new SR(); R=r;
  r.lang=S.lang==='ko'?'ko-KR':'en-US'; r.interimResults=true; r.maxAlternatives=3; r.continuous=false;
  var got=false;
  r.onstart=function(){ setState('listening'); };
  r.onresult=function(e){
    var res=e.results[e.results.length-1];
    var alts=Array.prototype.map.call(res,function(a){return {t:String(a.transcript).trim(),c:a.confidence||0};});
    $('#interim').textContent=alts[0].t;
    if(res.isFinal&&!got){ got=true; $('#interim').textContent=''; heard(alts); }
  };
  r.onerror=function(e){
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      S.mic=false; S.micNote=P('The microphone is not available on this screen, so continue with the text box and buttons. Check that the browser allows the microphone.','이 화면에서는 마이크를 쓸 수 없어 입력창과 버튼으로 진행합니다. 브라우저에서 마이크를 허용했는지 확인해 주세요.'); render();
    }
  };
  r.onend=function(){
    if(R===r) R=null;
    if(!got&&S.mic&&(S.running||force)&&!S.paused&&S.state!=='speaking'){
      S.silent++;
      if(S.silent<=2&&S.handsFree&&S.running) setTimeout(function(){ if(S.state!=='speaking'&&!R) listen(); },250);
      else setState('idle');
    } else if(!got){ setState('idle'); }
  };
  try{ r.start(); }catch(e){}
}
function addChat(who,text){ S.chat.push({who:who,text:text}); if(S.chat.length>6) S.chat.shift(); }
async function reply(text){
  var my=++S.token;
  stopListen();
  addChat('ai',text); render(); setState('speaking');
  await speak(text);
  if(my!==S.token||!S.running||S.paused) return;
  setState('idle'); S.silent=0; listen();
}

/* ================= 진행 엔진 ================= */
function begin(startSec){
  S.running=true; S.paused=false; S.done=false; S.trail=[]; S.chat=[]; S.startSec=null;
  loadRec();
  var idx=firstOpenIdx();
  if(idx>=ITEMS.length) idx=1;
  if(startSec){
    if(!S.rec[ITEMS[0].id]){ idx=0; S.startSec=startSec; }
    else { var j=firstOpenIdx(startSec); idx=j<ITEMS.length?j:ITEMS.findIndex(function(x){return x.sec===startSec;}); }
  }
  S.idx=idx;
  try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').catch(function(){}); }catch(e){}
  S.tab='run'; showTab();
  present(S.rec[ITEMS[0].id]&&idx>0?T('resumeNote'):T('hello'));
}
function setMode(m){
  if(S.view){ exitView(); S.tab='run'; }
  if(S.mode===m) return;
  S.mode=m; saveSettings();
  if(m==='form'){
    S.token++; try{speechSynthesis.cancel();}catch(e){} stopListen();
    S.running=false; S.paused=false; S.phase='idle'; setState('idle');
  }
  S.tab='run'; showTab();
}
function present(prefix){
  var it=cur(); S.pend=null; S.trail=[];
  S.phase=it.type==='multi'?'multi':'ask';
  if(it.type==='multi') S.pend={vals:[]};
  var txt=prefix||'';
  var prev=ITEMS[S.idx-1];
  if(it.sec!=='head'&&(!prev||prev.sec!==it.sec)) txt+=T('sec',SECS[it.sec]);
  txt+=promptOf(it);
  return reply(txt);
}
function nextItem(prefix){
  S.idx++;
  if(S.startSec){ var j=ITEMS.findIndex(function(x){return x.sec===S.startSec;}); if(j>S.idx) S.idx=j; S.startSec=null; }
  if(S.idx>=ITEMS.length) return finish();
  return present(prefix);
}
function commitFor(it,o,trail){
  var prev=S.rec[it.id];
  var hist=(prev&&prev.hist?prev.hist.slice():[]);
  if(prev&&prev.value!==o.value&&it.type!=='multi') hist.push({v:prev.value,at:prev.at,why:'수정 전 값'+(prev.action?' · 시정조치: '+prev.action:'')});
  (trail||[]).forEach(function(x){ hist.push(x); });
  S.rec[it.id]=Object.assign({},o,{at:new Date().toISOString(),hist:hist});
  saveRec();
}
function commit(o){ var t=S.trail; S.trail=[]; commitFor(cur(),o,t); }
function clearRec(it){ delete S.rec[it.id]; saveRec(); }
function firstOpenIdx(sec){
  for(var i=0;i<ITEMS.length;i++){ if(sec&&ITEMS[i].sec!==sec) continue; if(!S.rec[ITEMS[i].id]) return i; }
  return ITEMS.length;
}
function counts(){
  var c={ok:0,bad:0,noAct:0,skip:0,total:ITEMS.length-1,done:0};
  ITEMS.forEach(function(it){ var r=S.rec[it.id]; if(!r||it.sec==='head') return; c.done++;
    if(r.status==='ok') c.ok++; else if(r.status==='skip') c.skip++; else { c.bad++; if(!r.action) c.noAct++; } });
  return c;
}
function finish(){
  var c=counts(); S.running=false; S.done=true; S.phase='idle'; stopListen(); S.tab='log';
  var txt=T('finish',c.bad,c.noAct); addChat('ai',txt); showTab(); render();
  setState('speaking'); speak(txt).then(function(){ setState('idle'); });
}
function pause(){ S.paused=true; S.token++; try{speechSynthesis.cancel();}catch(e){} stopListen(); setState('idle'); render(); }
function resume(){ S.paused=false; present(T('resumeNote')); }
function goBack(){ if(S.idx>0){ S.idx--; present(T('backNote')); } else reply(promptOf(cur())); }
function skipItem(){ if(cur().type==='text'){ commit({status:'ok',value:'-'}); } else commit({status:'skip',value:'N/A'}); nextItem(T('echoSkip')); }

function handleValue(v,alts){
  var it=cur();
  if(v===null) return reply(T('needNum'));
  var lim=plaus(it); if(v<lim[0]||v>lim[1]) return reply(T('implaus'));
  if(S.pend&&S.pend.kind==='val') S.trail.push({v:S.pend.v,at:new Date().toISOString(),why:'정정 전 값'+(S.pend.st!=='ok'?' (기준 이탈)':'')});
  var st=evalRule(it.rule,v), low=alts&&alts[0]&&alts[0].c&&alts[0].c<0.6;
  S.pend={kind:'val',v:v,st:st};
  if(st!=='ok'){ S.phase='oor'; return reply(T('oor',it,v)); }
  S.phase='confirm'; return reply((low?T('unsure'):'')+fmt(it,v)+T('okq'));
}
function acceptPend(){
  var p=S.pend, it=cur();
  if(p.kind==='val'){ commit({status:'ok',value:p.v,unit:it.unit}); return nextItem(fmt(it,p.v)+'. '); }
  if(p.kind==='yn'){ commit({status:'ok',value:'Yes'}); return nextItem(T('echoYes')); }
  if(p.kind==='text'){ commit({status:'ok',value:p.text}); return nextItem(''); }
  if(p.kind==='actionConfirm'){
    var o={status:p.st,value:p.value,action:p.text,unit:it.unit};
    if(p.vals) o.vals=p.vals;
    commit(o); return nextItem('');
  }
}
function toAction(st,value,extra){
  S.phase='action'; S.pend=Object.assign({kind:'action',st:st,value:value},extra||{});
}

var H={
  ask:function(t,alts){
    var it=cur();
    if(it.type==='yn'){
      var y=parseYN(t);
      if(y===null) return reply(T('needYN'));
      if(y==='y'){
        if(S.autoYN){ commit({status:'ok',value:'Yes'}); return nextItem(T('echoYes')); }
        S.phase='confirm'; S.pend={kind:'yn'}; return reply((S.lang==='ko'?'예':'Yes')+T('okq'));
      }
      toAction('fail','No'); return reply(T('failAsk'));
    }
    if(it.type==='num') return handleValue(pn(t,it),alts);
    if(it.type==='text'){
      if(RE.later.test(t.trim())){ commit({status:'ok',value:'-'}); return nextItem(T('noneNote')); }
      S.phase='confirm'; S.pend={kind:'text',text:t}; return reply(T('textRead',t));
    }
  },
  confirm:function(t,alts){
    var p=S.pend, it=cur(), y=parseYN(t);
    if(p.kind==='val'){
      var nv=pn(t,it);
      if(nv!==null){ if(y==='y'&&Math.abs(nv-p.v)<0.05) return acceptPend(); return handleValue(nv,alts); }
    }
    if(y==='y') return acceptPend();
    if(y==='n'){
      if(p.kind==='actionConfirm'){ toAction(p.st,p.value,{vals:p.vals}); return reply(T('actionAsk')); }
      if(p.kind==='val') S.trail.push({v:p.v,at:new Date().toISOString(),why:'정정 전 값'});
      S.phase='ask'; S.pend=null; return reply(T('again'));
    }
    if(p.kind==='val'){ var v=pn(t,it); if(v!==null) return handleValue(v,alts); }
    if(p.kind==='text'){ S.pend={kind:'text',text:t}; return reply(T('textRead',t)); }
    if(p.kind==='actionConfirm'){ S.pend=Object.assign({},p,{text:t}); return reply(T('actionRead',t)); }
    return reply(T('needYN'));
  },
  oor:function(t,alts){
    var v=pn(t,cur()), y=parseYN(t);
    if(RE.keep.test(t)||(y==='y'&&v===null)){ toAction('out',S.pend.v); return reply(T('actionAsk')); }
    if(v!==null) return handleValue(v,alts);
    if(RE.redo.test(t)||y==='n'){ S.trail.push({v:S.pend.v,at:new Date().toISOString(),why:'기준 이탈 후 재측정'}); S.pend=null; S.phase='ask'; return reply(T('remeasure')); }
    return reply(T('oorHelp'));
  },
  action:function(t){
    var p=S.pend;
    if(RE.later.test(t.trim())){
      var it=cur(), o={status:p.st,value:p.value,action:'',unit:it.unit}; if(p.vals) o.vals=p.vals; commit(o); return nextItem('');
    }
    if(t.length<=4&&parseYN(t)!==null) return reply(T('actionAsk'));
    S.phase='confirm'; S.pend=Object.assign({},p,{kind:'actionConfirm',text:t}); return reply(T('actionRead',t));
  },
  multi:function(t,alts){
    var it=cur(), p=S.pend;
    if(RE.doneForce.test(t)) return finishMulti(true);
    if(RE.done.test(t.trim())) return finishMulti(false);
    if(RE.undo.test(t.trim())){ var x=p.vals.pop(); render(); return reply(T('undone',x?fmt(it,x.v):'')); }
    var v=pn(t,it); if(v===null) return reply(T('multiHelp'));
    var lim=plaus(it); if(v<lim[0]||v>lim[1]) return reply(T('implaus'));
    var st=evalRule(it.rule,v); p.vals.push({v:v,st:st}); render();
    return reply(p.vals.length+T('nth')+' '+fmt(it,v)+(st!=='ok'?T('outShort'):''));
  }
};
function finishMulti(force){
  var it=cur(), p=S.pend, n=p.vals.length;
  if(n<it.min&&!force) return reply(T('few',n,it.min));
  var bad=p.vals.filter(function(x){return x.st!=='ok';});
  var joined=p.vals.map(function(x){return x.v;}).join(', ');
  if(bad.length){ toAction('out',joined,{vals:p.vals}); return reply(T('multiBad',bad.length)+T('actionAsk')); }
  commit({status:n<it.min?'short':'ok',value:joined,vals:p.vals,unit:it.unit});
  return nextItem('');
}

function heard(alts){ addChat('me',alts[0].t); route(alts[0].t,alts); }
function route(text,alts){
  var t=String(text).trim(); if(!t) return;
  alts=alts||[{t:t,c:1}];
  if(!S.running){
    if(S.paused) return;
    if(RE.line.test(t)) return begin('line');
    if(RE.start.test(t)) return begin();
    addChat('ai',T('startHint')); render(); return;
  }
  if(S.paused){ if(/(시작|계속|재개|resume|continue|go)/i.test(t)) resume(); return; }
  var short=t.length<=12&&S.phase!=='action';
  if(short){
    if(RE.slow.test(t)&&S.running){ S.rate=Math.max(0.6,Math.round((S.rate-0.15)*100)/100); saveSettings(); syncRate(); return reply(T('slower')+promptOf(cur())); }
    if(RE.fast.test(t)&&S.running){ S.rate=Math.min(1.6,Math.round((S.rate+0.15)*100)/100); saveSettings(); syncRate(); return reply(T('faster')+promptOf(cur())); }
    if(RE.pause.test(t)) return pause();
    if(RE.back.test(t)) return goBack();
    if(RE.repeat.test(t)&&S.phase!=='oor') return reply(promptOf(cur()));
    if(RE.skip.test(t)&&(S.phase==='ask'||S.phase==='multi')) return skipItem();
  }
  var h=H[S.phase]; if(h) return h(t,alts);
}

var Q={map:store.get('cz-queue')||{},sent:store.get('cz-sent')||{}};
function persistQ(){ store.set('cz-queue',Q.map); store.set('cz-sent',Q.sent); }
function hs(str){ var h=5381; for(var i=0;i<str.length;i++) h=((h<<5)+h+str.charCodeAt(i))|0; return String(h); }
function syncOn(){ return !!(S.sync.url&&S.sync.key&&S.sync.on!==false); }
function pad2(n){ return String(n).padStart(2,'0'); }
function rowFor(it,r){
  var mg=S.rec[ITEMS[0].id], k=dateKey()+'|'+S.shift+'|'+it.id, d=new Date(r.at);
  var ans=r.value, ansC='', unit='';

var flushTimer=null, flushing=false;
function syncScan(){
  if(S.view||!syncOn()) return;
  ITEMS.forEach(function(it){
    var r=S.rec[it.id], k=dateKey()+'|'+S.shift+'|'+it.id;
    if(!r){ if(Q.sent[k]) Q.map[k]={k:k,del:true}; else delete Q.map[k]; return; }
    var ro=rowFor(it,r);
    if(Q.sent[k]===ro.sg) delete Q.map[k]; else Q.map[k]=ro;
  });
  persistQ(); updateBadge();
  clearTimeout(flushTimer); flushTimer=setTimeout(flush,1200);
}
function qCount(){ return Object.keys(Q.map).length; }
function flush(){
  if(!syncOn()||flushing) return Promise.resolve();
  var rows=Object.keys(Q.map).map(function(k){return Q.map[k];});
  if(!rows.length){ S.sync.err=''; updateBadge(); return Promise.resolve(); }
  flushing=true; updateBadge();
  return fetch(S.sync.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:S.sync.key,rows:rows.map(function(r){return r.del?{k:r.k,del:true}:{k:r.k,v:r.v,raw:r.raw};})})})
   .then(function(r){ return r.json(); })
   .then(function(j){
     if(!j.ok) throw new Error(j.error||'error');
     rows.forEach(function(r){ if(r.del) delete Q.sent[r.k]; else Q.sent[r.k]=r.sg; if(Q.map[r.k]===r) delete Q.map[r.k]; });
     persistQ(); S.sync.last=new Date(); S.sync.err='';
   })
   .catch(function(e){ S.sync.err=String((e&&e.message)||e); })
   .then(function(){ flushing=false; updateBadge(); if(qCount()&&!S.sync.err) setTimeout(flush,300); });
}

function pull(manual){

function fNum(i,raw){
  var it=ITEMS[i], prev=S.rec[it.id];
  delete S.fmsg[i];
  if(raw===''||raw==null){ if(prev&&prev.status!=='skip') clearRec(it); return refreshItem(i); }
  var v=parseFloat(raw); if(isNaN(v)) return refreshItem(i);
  v=inF(it,v);
  var lim=plaus(it);
  if(v<lim[0]||v>lim[1]){ S.fmsg[i]=P('Value is out of the possible range. Please check it.','값이 범위를 벗어났어요. 다시 확인해 주세요.'); return refreshItem(i); }
  var st=evalRule(it.rule,v)==='ok'?'ok':'out';
  commitFor(it,{status:st,value:v,unit:it.unit,action:st==='out'&&prev?(prev.action||''):''});
  refreshItem(i);
}
function fSaveMulti(it,vals,prev){
  if(!vals.length){ clearRec(it); return; }
  var bad=vals.some(function(x){return x.st!=='ok';});
  commitFor(it,{status:bad?'out':(vals.length<it.min?'short':'ok'),value:vals.map(function(x){return x.v;}).join(', '),vals:vals,unit:it.unit,action:bad&&prev?(prev.action||''):''});
}
function fAddTemp(i){
  var it=ITEMS[i], inp=$('#m-'+i), v=parseFloat(inp.value); if(isNaN(v)) return;
  v=inF(it,v);
  var lim=plaus(it); if(v<lim[0]||v>lim[1]){ S.fmsg[i]=P('Value is out of the possible range. Please check it.','값이 범위를 벗어났어요. 다시 확인해 주세요.'); return refreshItem(i); }
  delete S.fmsg[i];
  var prev=S.rec[it.id], vals=(prev&&prev.vals?prev.vals.slice():[]);
  vals.push({v:v,st:evalRule(it.rule,v)}); fSaveMulti(it,vals,prev); refreshItem(i);
  var n=$('#m-'+i); if(n) n.focus();
}
function itemIndexOf(el){ var d=el.closest('[data-i]'); return d?parseInt(d.dataset.i,10):null; }
function handleFormClick(b){
  var i=itemIndexOf(b), it=i!=null?ITEMS[i]:null, prev=it?S.rec[it.id]:null;
  if(b.dataset.fy){
    var v=b.dataset.fy;
    if(v==='y') { if(prev&&prev.value==='Yes') clearRec(it); else commitFor(it,{status:'ok',value:'Yes'}); }
    else if(v==='n'){ if(prev&&prev.value==='No') clearRec(it); else commitFor(it,{status:'fail',value:'No',action:''}); }
    else { if(prev&&prev.status==='skip') clearRec(it); else commitFor(it,{status:'skip',value:'N/A'}); }
    refreshItem(i); return true;
  }
  if(b.dataset.fna!=null){ if(prev&&prev.status==='skip') clearRec(it); else commitFor(it,{status:'skip',value:'N/A'}); delete S.fmsg[i]; refreshItem(i); return true; }
  if(b.dataset.fnone!=null){ if(prev&&prev.value==='-') clearRec(it); else commitFor(it,{status:'ok',value:'-'}); refreshItem(i); return true; }
  if(b.dataset.fadd!=null){ fAddTemp(i); return true; }
  if(b.dataset.fdel!=null){
    var vals=(prev&&prev.vals?prev.vals.slice():[]); vals.splice(parseInt(b.dataset.fdel,10),1);
    vals=vals.map(function(x){return {v:x.v,st:evalRule(it.rule,x.v)};});
    fSaveMulti(it,vals,prev); refreshItem(i); return true;
  }
  if(b.dataset.fsec){
    var d=$('#fs-'+b.dataset.fsec); if(d){ d.open=true; S.openSec[b.dataset.fsec]=true; d.scrollIntoView({behavior:'smooth',block:'start'}); }
    return true;
  }
  return false;
}

function buildRows(){
  var rows=[['Date 날짜','Shift 근무','Manager 매니저','Time 기록시각','Section 구역','Item (original) 항목(원문)','Item (Korean) 항목(한글)','Answer 응답','Unit 단위','Limit 기준','Result 판정','Corrective action 시정조치','Edit history 정정 이력']];
  var mgr=S.rec[ITEMS[0].id]; var mgrName=mgr?mgr.value:'';
  ITEMS.forEach(function(it){
    var r=S.rec[it.id]; if(!r||it.sec==='head') return;
    var st={ok:'OK 정상',skip:'Skipped 건너뜀',fail:'No 아니요',out:'Out of range 기준 이탈',short:'Under 5 5회 미달'}[r.status]||r.status;
    var d=new Date(r.at);
    var t=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    var ans=r.value;
    if(it.type==='num'&&typeof r.value==='number') ans=dv(it,r.value);
    else if(it.type==='multi') ans=(r.value+'').split(', ').map(function(s){return dv(it,parseFloat(s));}).join(', ');
    rows.push([dateKey(),S.shift==='lunch'?'Lunch':'Dinner',mgrName,t,SECS[it.sec].en,it.en,(it.nm||it.ko).replace(/[.?？]$/,''),ans,it.type==='num'||it.type==='multi'?unitOf(it):'',it.rule?ruleText(it.rule):'',st,r.action||'',(r.hist||[]).map(function(x){return dvAny(it,x.v)+' ('+whyText(x.why)+')';}).join('; ')]);
  });
  return rows;
}
function exportXlsx(){
  var rows=buildRows(), note=$('#expNote');
  if(rows.length<2){ note.textContent=P('Nothing to export yet.','내보낼 기록이 없어요.'); return; }
  try{
    if(!window.XLSX) throw new Error('no xlsx');
    var ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:11},{wch:8},{wch:12},{wch:8},{wch:18},{wch:48},{wch:40},{wch:14},{wch:6},{wch:22},{wch:16},{wch:30},{wch:28}];
    var wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Critical Zone');
    XLSX.writeFile(wb,'CriticalZone_'+dateKey()+'_'+S.shift+'.xlsx');
    note.textContent=P('Excel file created. Check your Downloads folder.','엑셀 파일을 만들었어요. 다운로드 폴더를 확인해 주세요.');
  }catch(e){ note.textContent=P('Download is not available. Copy as a table and paste into Excel.','내려받기를 쓸 수 없어요. 표로 복사해서 엑셀에 붙여넣으세요.'); }
}
function copyTable(){
  var rows=buildRows(), note=$('#expNote');
  var tsv=rows.map(function(r){return r.map(function(c){return String(c==null?'':c).replace(/[\t\n]/g,' ');}).join('\t');}).join('\n');
  var okMsg=P('Copied. Paste it into Excel.','복사했어요. 엑셀에 붙여넣으세요.');
  function fallback(){
    var ta=document.createElement('textarea'); ta.value=tsv; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    var ok=false; try{ok=document.execCommand('copy');}catch(e){} document.body.removeChild(ta);
    note.textContent=ok?okMsg:P('Copying is blocked here.','복사가 막혀 있어요.');
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(tsv).then(function(){note.textContent=okMsg;},fallback); } else fallback();
}

    if(S.view) return;
    var ji=parseInt(b.dataset.jump,10);
    if(S.mode==='form'){ S.tab='run'; S.openSec[ITEMS[ji].sec]=true; showTab(); var tn=$('#fi-'+ji); if(tn) tn.scrollIntoView({block:'center'}); return; }
    S.idx=ji; S.running=true; S.paused=false; S.tab='run'; showTab(); return present('');
  }
  if(b.dataset.q){ addChat('me',b.dataset.q); return route(b.dataset.q); }
  if(b.id==='mic'){
    if(S.state==='listening'){ stopListen(); return setState('idle'); }
    if(S.state==='speaking'){ S.token++; try{speechSynthesis.cancel();}catch(err){} }
    S.silent=0; return listen(true);
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='voiceSel'){ S.voice[S.lang]=t.value||null; saveSettings(); return; }
  if(t.dataset&&t.dataset.fnum!=null){ return fNum(itemIndexOf(t),t.value.trim()); }
  if(t.dataset&&t.dataset.ftext!=null){
    var ti=itemIndexOf(t), tit=ITEMS[ti], tv=t.value.trim();
    if(tv) commitFor(tit,{status:'ok',value:tv}); else if(S.rec[tit.id]&&S.rec[tit.id].value!=='-') clearRec(tit);
    return refreshItem(ti);
  }
  if(t.dataset&&t.dataset.fact!=null){
    var ai=itemIndexOf(t), ait=ITEMS[ai], ar=S.rec[ait.id];
    if(ar){ ar.action=t.value.trim(); saveRec(); updateFormMeta(); }
    return;
  }
  if(t.dataset&&t.dataset.fmgr!=null){
    var mv=t.value.trim(); if(mv) commitFor(ITEMS[0],{status:'ok',value:mv}); else clearRec(ITEMS[0]);
    return updateFormMeta();
  }
  if(t.dataset&&t.dataset.rule){ var v=parseFloat(t.value); if(!isNaN(v)){ var tmp=t.dataset.rule!=='sani'; S.rules[t.dataset.rule][t.dataset.k]=(tmp&&S.unit==='C')?Math.round(cToF(v)*100)/100:v; saveSettings(); renderRules(); } return; }
  if(t.dataset&&t.dataset.sync){ var f=t.dataset.sync, nv=t.value.trim(); if(f==='url'&&nv&&!/^https:\/\//.test(nv)){ syMsg('The address must start with https://','주소는 https:// 로 시작해야 해요.'); return; } var chg=(S.sync[f]!==nv); S.sync[f]=nv; saveSettings(); if(chg&&(f==='url'||f==='key')){ Q.sent={}; Q.map={}; persistQ(); } if(chg&&f==='who'){ Q.sent={}; Q.map={}; persistQ(); } if(chg&&syncOn()){ syncScan(); pull(); } updateBadge(); return; }
  if(t.id==='syOn'){ S.sync.on=t.checked; saveSettings(); if(t.checked){ syncScan(); pull(); } updateBadge(); return; }
  if(t.id==='optAuto'){ S.autoYN=t.checked; saveSettings(); }
  if(t.id==='optHands'){ S.handsFree=t.checked; saveSettings(); }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='rateRange'){ S.rate=parseFloat(t.value)||1; var v=$('#rateVal'); if(v) v.textContent=fmtRate(); saveSettings(); }
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter') return;
  var t=e.target;
  if(t.id&&t.id.indexOf('m-')===0&&t.dataset){ e.preventDefault(); return fAddTemp(itemIndexOf(t)); }
  if(t.dataset&&t.dataset.fnum!=null){ e.preventDefault(); t.blur(); }
});
document.addEventListener('toggle',function(e){ var d=e.target; if(d&&d.dataset&&d.dataset.sec) S.openSec[d.dataset.sec]=d.open; },true);
$('#sayForm').addEventListener('submit',function(e){
  e.preventDefault(); var i=$('#say'), v=i.value.trim(); if(!v) return; i.value='';
  addChat('me',v); route(v);
});
window.CZ={S:S,ITEMS:ITEMS,setMode:setMode,route:route,parseNum:parseNum,parseYN:parseYN,begin:begin,buildRows:buildRows,evalRule:evalRule,Q:Q,syncScan:syncScan,flush:flush,pull:pull,openView:openView,exitView:exitView,historyList:historyList,ruleText:ruleText,fToC:fToC,cToF:cToF,pn:pn,dv:dv,fmt:fmt,B:B};
renderVset();
try{ if('speechSynthesis' in window&&speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged',renderVset); }catch(e){}
showTab(); setState('idle');
if(syncOn()){ syncScan(); pull(); }
setInterval(function(){ if(document.hidden) return; if(syncOn()){ if(qCount()) flush(); if(!S.running&&!editing()) pull(); } },45000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden&&syncOn()){ flush(); if(!S.running&&!editing()) pull(); } });
window.addEventListener('online',function(){ if(syncOn()) flush(); });
})();
</script>
